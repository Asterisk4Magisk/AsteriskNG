[versions]
agp = "9.4.1"
androidx-activity-compose = "1.13.0"
androidx-navigationevent = "1.1.0"
androidx-room = "2.8.5"
androidx-work = "2.12.0"
compose = "1.12.1"
coil = "3.6.3"
dexlib2 = "3.0.10"
kotlin = "2.4.20"
kotlinx-serialization-json = "1.11.0"
ksp = "2.3.12"
ktor = "3.6.0"
kage = "0.7.0"
grpc = "1.84.0"
libsu = "6.0.0"
miuix = "0.9.4"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
reorderable = "3.1.0"
snakeyaml-engine = "3.1.1"
sora-editor = "0.24.6"
zxing-android-embedded = "4.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigationevent = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "dexlib2" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
kage = { module = "com.github.android-password-store:kage", version.ref = "kage" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora-editor" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-android-embedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
